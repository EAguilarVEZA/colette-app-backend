<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Colette French Pastries — Crew Scheduler</title>
<style>
  :root{
    --bg:#f6f1ea; --card:#ffffff; --ink:#332218; --ink2:#7a6a5d;
    --accent:#a9622f; --accent-soft:#f3e3d3; --line:#e8ddd1;
    --green:#3d7d4f; --green-soft:#e3f0e6; --red:#b0483a; --red-soft:#f7e5e2;
    --amber:#9a7b1f; --amber-soft:#f6eecf;
    --radius:14px; --shadow:0 1px 3px rgba(51,34,24,.08),0 4px 14px rgba(51,34,24,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); font-size:16px; line-height:1.45;
  }
  #app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
  header.top{
    padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.2px}
  .brand .cup{font-size:22px}
  .brand small{display:block;font-size:11px;font-weight:600;color:var(--ink2);letter-spacing:.4px}
  .pill{border:none;background:var(--card);box-shadow:var(--shadow);border-radius:999px;
    padding:8px 14px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer}
  main{flex:1;padding:0 14px calc(96px + env(safe-area-inset-bottom))}
  h2.section{font-size:14px;font-weight:800;color:var(--ink2);text-transform:uppercase;
    letter-spacing:.8px;margin:18px 4px 10px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}

  /* week bar */
  .weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}
  .weekbar .wk{font-weight:800;font-size:15px}
  .weekbar .wk .pubtag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:2px}
  .navbtn{width:38px;height:38px;border-radius:12px;border:none;background:var(--card);
    box-shadow:var(--shadow);font-size:17px;font-weight:800;color:var(--accent);cursor:pointer}
  .daytabs{display:flex;gap:5px;margin-bottom:12px}
  .daytab{flex:1;border:none;background:var(--card);box-shadow:var(--shadow);border-radius:12px;
    padding:8px 2px 7px;text-align:center;cursor:pointer;color:var(--ink)}
  .daytab .dn{font-size:11px;font-weight:700;color:var(--ink2)}
  .daytab .dd{font-size:15px;font-weight:800}
  .daytab .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin:3px auto 0;opacity:0}
  .daytab.hasshifts .dot{opacity:1}
  .daytab.active{background:var(--ink);color:#fff}
  .daytab.active .dn{color:#d8c8bb}
  .daytab.active .dot{background:#e8b98a}

  /* shift cards */
  .shift{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
  .shift:last-child{border-bottom:none}
  .shift .time{min-width:86px}
  .shift .time b{font-size:15px;display:block}
  .shift .time span{font-size:12px;color:var(--ink2);font-weight:600}
  .chip{flex:1;display:flex;align-items:center;gap:8px;border:none;background:var(--accent-soft);
    border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left}
  .chip.unassigned{background:var(--amber-soft);color:var(--amber)}
  .chip .avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;color:#fff;flex-shrink:0}
  .chip .warn{margin-left:auto;font-size:13px}
  .shift .del{border:none;background:none;color:#c9b8a9;font-size:18px;cursor:pointer;padding:6px}
  .confirmtag{font-size:10px;font-weight:800;letter-spacing:.3px;border-radius:6px;padding:2px 6px}
  .ok{background:var(--green-soft);color:var(--green)} .pend{background:var(--amber-soft);color:var(--amber)}
  .pub{background:var(--green-soft);color:var(--green)} .draft{background:var(--amber-soft);color:var(--amber)}

  .addshift{width:100%;border:2px dashed var(--line);background:none;border-radius:var(--radius);
    padding:13px;font-size:14px;font-weight:700;color:var(--accent);cursor:pointer;margin-bottom:12px}
  .rowbtns{display:flex;gap:10px;margin:2px 0 12px}
  .btn{flex:1;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:800;cursor:pointer}
  .btn.primary{background:var(--ink);color:#fff}
  .btn.soft{background:var(--card);box-shadow:var(--shadow);color:var(--ink)}
  .btn.green{background:var(--green);color:#fff}
  .btn.sm{padding:9px 12px;font-size:13px;flex:0 0 auto}

  .stats{display:flex;gap:10px}
  .stat{flex:1;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;text-align:center}
  .stat b{font-size:19px;display:block}
  .stat span{font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px}
  .hourrow{display:flex;align-items:center;gap:10px;padding:7px 2px;font-size:14px}
  .hourrow .bar{flex:1;height:8px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
  .hourrow .bar i{display:block;height:100%;border-radius:99px}
  .hourrow b{min-width:52px;text-align:right;font-size:13px}
  .hourrow .nm{min-width:86px;font-weight:700;font-size:13px}

  /* team */
  .emp{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer}
  .emp:last-child{border-bottom:none}
  .emp .avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#fff;font-size:15px;flex-shrink:0}
  .emp .who b{display:block;font-size:15px}
  .emp .who span{font-size:12.5px;color:var(--ink2);font-weight:600}
  .emp .arr{margin-left:auto;color:#c9b8a9;font-size:18px}

  /* texts */
  .msgcard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
  .msgcard .mhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .msgcard .mhead .avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:13px}
  .msgcard .mhead b{font-size:15px}
  .msgcard .mhead span{font-size:12px;color:var(--ink2);font-weight:600;display:block}
  .bubble{background:#e9f2ea;border:1px solid #d3e4d6;border-radius:12px;padding:10px 12px;
    font-size:13.5px;white-space:pre-wrap;margin-bottom:10px;color:#28422e}
  .msgbtns{display:flex;gap:8px}
  .msgbtns .btn{padding:10px;font-size:13px}
  a.btnlink{flex:1;display:block;text-align:center;text-decoration:none;border-radius:12px;
    padding:10px;font-size:13px;font-weight:800;background:var(--green);color:#fff}
  .note{background:var(--amber-soft);border-radius:var(--radius);padding:12px 14px;font-size:13px;color:#6e5a1c;margin-bottom:12px}
  .note b{display:block;margin-bottom:2px}

  /* my week */
  .myshift{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
  .myshift:last-child{border-bottom:none}
  .myshift .dchip{min-width:52px;text-align:center;background:var(--accent-soft);border-radius:10px;padding:6px 4px}
  .myshift .dchip b{display:block;font-size:16px}
  .myshift .dchip span{font-size:10.5px;font-weight:800;color:var(--accent);text-transform:uppercase}
  .myshift .info{flex:1}
  .myshift .info b{display:block;font-size:14.5px}
  .myshift .info span{font-size:12.5px;color:var(--ink2);font-weight:600}
  .cbtn{border:none;border-radius:10px;padding:9px 13px;font-size:12.5px;font-weight:800;cursor:pointer;
    background:var(--accent-soft);color:var(--accent)}
  .cbtn.done{background:var(--green-soft);color:var(--green)}
  .whoami{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .whoami .pchip{border:none;border-radius:999px;padding:9px 15px;font-weight:700;font-size:13.5px;
    background:var(--card);box-shadow:var(--shadow);cursor:pointer;color:var(--ink)}
  .whoami .pchip.sel{background:var(--ink);color:#fff}

  /* bottom nav */
  nav.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
    background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);
    display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:40}
  nav.bottom button{flex:1;border:none;background:none;cursor:pointer;padding:6px 0 2px;
    font-size:10.5px;font-weight:700;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px}
  nav.bottom button .ic{font-size:20px}
  nav.bottom button.active{color:var(--accent)}

  /* sheet / modal */
  .overlay{position:fixed;inset:0;background:rgba(30,18,10,.45);z-index:60;display:none;align-items:flex-end;justify-content:center}
  .overlay.open{display:flex}
  .sheet{background:var(--bg);width:100%;max-width:520px;border-radius:22px 22px 0 0;
    padding:10px 16px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow-y:auto}
  .sheet .grab{width:40px;height:4px;border-radius:99px;background:#d5c7b8;margin:4px auto 14px}
  .sheet h3{font-size:17px;font-weight:800;margin-bottom:12px}
  .sheet label{display:block;font-size:12px;font-weight:800;color:var(--ink2);text-transform:uppercase;
    letter-spacing:.5px;margin:12px 2px 6px}
  .sheet input,.sheet select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;
    font-size:15px;background:var(--card);color:var(--ink);font-family:inherit}
  .optrow{display:flex;gap:8px;flex-wrap:wrap}
  .optrow button{border:1px solid var(--line);background:var(--card);border-radius:999px;
    padding:9px 14px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--ink)}
  .optrow button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pickemp{display:flex;align-items:center;gap:12px;width:100%;border:none;background:var(--card);
    border-radius:12px;box-shadow:var(--shadow);padding:12px;margin-bottom:8px;cursor:pointer;text-align:left}
  .pickemp .avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:13px}
  .pickemp b{font-size:14.5px;display:block}
  .pickemp span{font-size:12px;color:var(--ink2);font-weight:600}
  .pickemp .right{margin-left:auto;text-align:right}
  .badge{font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 7px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:700;
    z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88%;text-align:center}
  .toast.show{opacity:1}
  .empty{color:var(--ink2);font-size:14px;text-align:center;padding:22px 10px;font-weight:600}
  .availgrid .arow{display:flex;align-items:center;gap:8px;padding:6px 0}
  .availgrid .arow .d{min-width:40px;font-weight:800;font-size:13px}
  .availgrid .arow select{flex:1;padding:9px}
  .availgrid .arow input{flex:1;padding:9px}
  .danger{color:var(--red);background:var(--red-soft)}

  /* login */
  #login{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;
    align-items:center;justify-content:center;padding:24px}
  .loginbox{max-width:340px;width:100%;text-align:center}
  .loginbox .bigcup{font-size:54px}
  .loginbox h1{font-size:22px;font-weight:800;margin:8px 0 2px}
  .loginbox .sub{color:var(--ink2);font-weight:700;font-size:12px;letter-spacing:.6px;
    text-transform:uppercase;margin-bottom:28px}
  .loginbox label{display:block;font-size:12px;font-weight:800;color:var(--ink2);
    text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
  .loginbox input{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px;
    font-size:24px;text-align:center;letter-spacing:10px;background:var(--card);
    color:var(--ink);margin-bottom:12px;font-family:inherit}
  .loginbox input.adm{font-size:15px;letter-spacing:0;text-align:left}
  .loginbox .btn{width:100%}
  .loginbox .swap{display:block;margin-top:18px;color:var(--accent);font-weight:700;
    font-size:13.5px;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="cup">🥐</span><span>Colette<small>FRENCH PASTRIES · CREW SCHEDULER</small></span></div>
    <span id="hdrbtns" style="display:flex;gap:8px"></span>
  </header>
  <main id="main"></main>
  <nav class="bottom">
    <button id="nav-sched" onclick="go('sched')"><span class="ic">📅</span>Schedule</button>
    <button id="nav-team" onclick="go('team')"><span class="ic">👥</span>Team</button>
    <button id="nav-texts" onclick="go('texts')"><span class="ic">💬</span>Texts</button>
    <button id="nav-pay" onclick="go('pay')"><span class="ic">💵</span>Payroll</button>
    <button id="nav-my" onclick="go('my')"><span class="ic">☕</span>My Week</button>
  </nav>
  <div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()">
    <div class="sheet" id="sheet"></div>
  </div>
  <div id="login"></div>
  <div class="toast" id="toast"></div>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)">
</div>
<script>
/* ================= STATE ================= */
const COLORS=['#a9622f','#3d7d4f','#4a6fa5','#9a5f9e','#b0483a','#7a8a3a','#3f8f8a','#8a6d3b'];
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
let S={
  shopName:'Colette French Pastries',
  location:{name:'Colette French Pastries',
    address:'2225 Old Milton Pkwy, Suite 100, Alpharetta, GA 30009',
    lat:34.070187, lng:-84.292770, radius:150},   // geofence radius in meters
  punches:[],   // {id,empId,date:'YYYY-MM-DD',in:ISO,out:ISO|null,inDist,outDist}
  auth:{adminId:'edgar',
    adminHash:'c876a763127581e553256770526722eaddfc01b5d86996c47fda8b033005ba62'},
  employees:[
    e0('Maya',   'Shift Lead','555-0101',19,0,'2314'),
    e0('Jordan', 'Barista',   '555-0102',16,1,'5872'),
    e0('Sam',    'Barista',   '555-0103',16,2,'1946'),
    e0('Priya',  'Barista',   '555-0104',16.5,3,'7203'),
    e0('Diego',  'Shift Lead','555-0105',18.5,4,'4651'),
    e0('Lily',   'Barista',   '555-0106',15.5,5,'8390'),
  ],
  templates:[
    {name:'Open', start:'06:30', end:'12:30'},
    {name:'Mid',  start:'09:00', end:'15:00'},
    {name:'Close',start:'12:30', end:'18:30'},
  ],
  weeks:{},           // weekKey -> {published:bool, shifts:[{id,day,start,end,tpl,empId,confirmed}]}
  sales:{},           // weekKey -> estimated sales $ (for labor efficiency %)
  textSpan:1,         // 1 = this week, 2 = lock in two weeks per text
  paySpan:1,          // payroll view: 1 or 2 weeks
  view:'sched',
  selDay: jsDay(),    // 0=Mon
  weekStart: monday(new Date()),
  meId:null,
  nextId:1,
};
function e0(name,role,phone,wage,ci,pin){
  return {id:'e'+ci, name, role, phone, wage, pin:pin||'',
    color:COLORS[ci%COLORS.length],
    avail:Array.from({length:7},()=>({type:'any'}))};
}

/* ================= AUTH & SESSION ================= */
let sess=null;   // {type:'admin'} | {type:'emp', empId}
function isAdmin(){return !!sess&&sess.type==='admin'}
const LS_STATE='colette_state', LS_SESS='colette_sess';
function lsGet(k){try{return localStorage.getItem(k)}catch{return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch{}}
function lsDel(k){try{localStorage.removeItem(k)}catch{}}
/* ---- cloud sync (endpoints live in this same Vercel project) ---- */
const API='/api';
function adminKey(){return lsGet('colette_adminkey')||''}
async function apiFetch(path,opts={},asAdmin){
  const headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});
  if(asAdmin&&adminKey())headers['x-admin-key']=adminKey();
  const r=await fetch(API+path,{...opts,headers});
  const d=await r.json().catch(()=>({}));
  return {status:r.status,...d};
}
async function pushState(){
  if(!adminKey()){toast('Set your Cloud sync key in ⚙️ first');return false}
  try{
    const r=await apiFetch('/sched-state',{method:'POST',body:JSON.stringify(S)},true);
    if(r.ok){toast('☁️ Synced — crew phones will update');return true}
    toast(r.error||r.fix||'Sync failed');return false;
  }catch{return false}
}
async function pullState(asAdmin){
  try{const r=await apiFetch('/sched-state',{},asAdmin);
    if(r.ok&&r.state)return r.state}catch{}
  return null;
}
function applyServerState(st){
  const keepAuth=S.auth,keepSales=S.sales;
  const wages={},pins={};
  S.employees.forEach(e=>{wages[e.id]=e.wage;pins[e.id]=e.pin});
  S=normalizeState(st);
  if(!S.auth)S.auth=keepAuth;
  if(!S.sales||!Object.keys(S.sales).length)S.sales=keepSales||{};
  S.employees.forEach(e=>{
    if(e.wage===undefined)e.wage=wages[e.id]!==undefined?wages[e.id]:0;
    if(e.pin===undefined)e.pin=pins[e.id]||''});
  if(sess&&sess.type==='emp'){S.meId=sess.empId;S.view='my'}
}
async function sha256(t){
  try{
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch{
    let h=5381;for(const c of t)h=((h*33)^c.charCodeAt(0))>>>0;return 'x'+h.toString(16);
  }
}
function renderLogin(){
  document.getElementById('login').innerHTML=`<div class="loginbox">
    <div class="bigcup">🥐</div><h1>${S.shopName}</h1><div class="sub">Crew Scheduler</div>
    <div id="pinmode">
      <label>Enter your 4-digit PIN</label>
      <input id="pinin" inputmode="numeric" maxlength="4" autocomplete="off"
        oninput="if(this.value.length===4)pinLogin()">
      <button class="btn green" onclick="pinLogin()">☕ Let's go</button>
      <span class="swap" onclick="swapLogin(true)">I'm the admin →</span>
    </div>
    <div id="adminmode" style="display:none">
      <label>Admin login</label>
      <input class="adm" id="aid" placeholder="Admin ID" autocomplete="off">
      <input class="adm" id="apw" type="password" placeholder="Password"
        onkeydown="if(event.key==='Enter')adminLogin()">
      <button class="btn primary" onclick="adminLogin()">🔑 Log in as admin</button>
      <span class="swap" onclick="swapLogin(false)">← Back to PIN</span>
    </div>
  </div>`;
}
function swapLogin(admin){
  document.getElementById('pinmode').style.display=admin?'none':'block';
  document.getElementById('adminmode').style.display=admin?'block':'none';
}
async function pinLogin(){
  const p=(document.getElementById('pinin').value||'').trim();
  if(!/^\d{4}$/.test(p)){toast('Enter your 4 digits');return}
  /* cloud first — works on any phone once the admin has synced */
  try{
    const r=await apiFetch('/sched-login',{method:'POST',body:JSON.stringify({pin:p})});
    if(r.ok){
      sess={type:'emp',empId:r.empId,pin:p};
      const st=await pullState(false);if(st)applyServerState(st);
      S.meId=r.empId;S.view='my';
      lsSet(LS_SESS,JSON.stringify(sess));
      render();toast(`Hey ${r.name} ☕`);return;
    }
    if(r.status===401){toast('PIN not recognized — ask the admin for yours');
      document.getElementById('pinin').value='';return}
  }catch{}
  /* offline / not-yet-synced fallback */
  const e=S.employees.find(x=>x.pin&&x.pin===p);
  if(!e){toast('PIN not recognized — ask the admin for yours');
    document.getElementById('pinin').value='';return}
  sess={type:'emp',empId:e.id,pin:p};S.meId=e.id;S.view='my';
  lsSet(LS_SESS,JSON.stringify(sess));
  render();toast(`Hey ${e.name} ☕`);
}
async function adminLogin(){
  const id=(document.getElementById('aid').value||'').trim().toLowerCase();
  const pw=document.getElementById('apw').value||'';
  const h=await sha256('colette|'+pw);
  if(id!==(S.auth.adminId||'').toLowerCase()||h!==S.auth.adminHash){
    toast('Wrong admin ID or password');return}
  sess={type:'admin'};S.view='sched';
  lsSet(LS_SESS,JSON.stringify(sess));
  render();toast('Welcome back, boss 👑');
}
function logout(){sess=null;S.meId=null;lsDel(LS_SESS);render()}
function updateHdr(){
  const h=document.getElementById('hdrbtns');
  if(!sess){h.innerHTML='';return}
  h.innerHTML=(isAdmin()
    ?`<button class="pill" onclick="exportData()">💾 Save</button>
      <button class="pill" onclick="openAdminSettings()">⚙️</button>`:'')+

function jsDay(){const d=new Date().getDay();return d===0?6:d-1}
function monday(d){const x=new Date(d);const dow=x.getDay();const diff=(dow===0?-6:1-dow);
  x.setDate(x.getDate()+diff);x.setHours(0,0,0,0);return x}
function wkKey(d){return d.toISOString().slice(0,10)}
function week(){const k=wkKey(S.weekStart);
  if(!S.weeks[k])S.weeks[k]={published:false,shifts:[]};return S.weeks[k]}
function dayDate(i){const d=new Date(S.weekStart);d.setDate(d.getDate()+i);return d}
function weekKeyAt(off){const d=new Date(S.weekStart);d.setDate(d.getDate()+off*7);return wkKey(d)}
function weekAt(off){const k=weekKeyAt(off);
  if(!S.weeks[k])S.weeks[k]={published:false,shifts:[]};return S.weeks[k]}
function dayDateAt(off,i){const d=new Date(S.weekStart);d.setDate(d.getDate()+off*7+i);return d}
function fmtRangeAt(off){return fmtD(dayDateAt(off,0))+' – '+fmtD(dayDateAt(off,6))}
function fmtD(d){return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function fmtRange(){const a=dayDate(0),b=dayDate(6);return fmtD(a)+' – '+fmtD(b)}
function t12(t){let[h,m]=t.split(':').map(Number);const ap=h>=12?'p':'a';h=h%12||12;
  return h+(m?':'+String(m).padStart(2,'0'):'')+ap}
function hrs(s){const[a,b]=[s.start,s.end].map(t=>{const[h,m]=t.split(':').map(Number);return h+m/60});
  return Math.max(0,b-a)}
function emp(id){return S.employees.find(e=>e.id===id)}
function initials(n){return n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}

/* ================= AVAILABILITY ================= */
function availIssue(e,shift){
  const a=e.avail[shift.day];
  if(a.type==='off')return DAYS[shift.day]+' is their day off';
  if(a.type==='custom'){
    if(shift.start<a.from||shift.end>a.to)
      return 'Only available '+t12(a.from)+'–'+t12(a.to)+' on '+DAYS[shift.day];
  }
  return null;
}
function weekHours(empId){return week().shifts.filter(s=>s.empId===empId).reduce((t,s)=>t+hrs(s),0)}

/* ================= AUTO-SCHEDULER ================= */
/* Learns from every past week: who usually works which day + shift,
   then fills open shifts respecting availability and balancing hours. */
function slotKey(s){return s.tpl||('t'+s.start)}
function histStats(beforeKey){
  const st={};
  Object.entries(S.weeks).forEach(([k,w])=>{
    if(k>=beforeKey)return;
    w.shifts.forEach(s=>{if(!s.empId)return;
      const a=s.empId+'|'+s.day+'|'+slotKey(s), b=s.empId+'|'+slotKey(s);
      st[a]=(st[a]||0)+1; st[b]=(st[b]||0)+1;});
  });
  return st;
}
function patternFor(targetKey){
  // most recent earlier week that has shifts → reuse its shape (times only)
  const keys=Object.keys(S.weeks).filter(k=>k<targetKey&&S.weeks[k].shifts.length).sort();
  if(keys.length){
    return S.weeks[keys[keys.length-1]].shifts.map(s=>({day:s.day,start:s.start,end:s.end,tpl:s.tpl}));
  }
  const pat=[];
  for(let d=0;d<7;d++)S.templates.forEach(t=>pat.push({day:d,start:t.start,end:t.end,tpl:t.name}));
  return pat;
}
function autoSchedule(offsets,fresh){
  let filled=0,gaps=0;
  offsets.forEach(off=>{
    const key=weekKeyAt(off), w=weekAt(off);
    if(fresh)w.shifts.forEach(s=>{s.empId=null;s.confirmed=false});
    if(!w.shifts.length){
      patternFor(key).forEach(p=>w.shifts.push(
        {id:'s'+(S.nextId++),day:p.day,start:p.start,end:p.end,tpl:p.tpl,empId:null,confirmed:false}));
    }
    const st=histStats(key);
    const hours={};S.employees.forEach(e=>hours[e.id]=0);
    w.shifts.forEach(s=>{if(s.empId)hours[s.empId]+=hrs(s)});
    const totalH=w.shifts.reduce((t,s)=>t+hrs(s),0);
    const target=totalH/Math.max(1,S.employees.length);
    const ordered=[...w.shifts].sort((a,b)=>a.day-b.day||(a.start<b.start?-1:1));
    ordered.forEach(s=>{
      if(s.empId)return;
      const cands=S.employees.filter(e=>!availIssue(e,s))
        .filter(e=>!w.shifts.some(x=>x.empId===e.id&&x.day===s.day&&x.id!==s.id&&x.start<s.end&&s.start<x.end));
      if(!cands.length){gaps++;return}
      let best=null,bs=-1e9;
      cands.forEach(e=>{
        const sc=3*(st[e.id+'|'+s.day+'|'+slotKey(s)]||0)   // worked this exact day+shift before
                +1*(st[e.id+'|'+slotKey(s)]||0)             // knows this shift type
                -1.5*Math.max(0,(hours[e.id]||0)+hrs(s)-target) // keep hours fair
                -0.4*(hours[e.id]||0);
        if(sc>bs){bs=sc;best=e}
      });
      s.empId=best.id;s.confirmed=false;hours[best.id]+=hrs(s);filled++;
    });
    w.published=false;
  });
  return {filled,gaps};
}

/* ================= GPS TIME CLOCK ================= */
function distM(aLat,aLng,bLat,bLng){
  const R=6371000,toR=x=>x*Math.PI/180;
  const dLat=toR(bLat-aLat),dLng=toR(bLng-aLng);
  const h=Math.sin(dLat/2)**2+Math.cos(toR(aLat))*Math.cos(toR(bLat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function fmtClock(d){d=new Date(d);let h=d.getHours();const m=String(d.getMinutes()).padStart(2,'0');
  const ap=h>=12?'pm':'am';h=h%12||12;return h+':'+m+ap}
function todayCtx(){const now=new Date();
  return {key:wkKey(monday(now)),day:jsDay(),dstr:now.toLocaleDateString('en-CA'),now}}
function todayShifts(eid){const t=todayCtx();const w=S.weeks[t.key];
  return w?w.shifts.filter(s=>s.empId===eid&&s.day===t.day).sort((a,b)=>a.start<b.start?-1:1):[]}
function openPunch(eid){const t=todayCtx();
  return S.punches.find(p=>p.empId===eid&&p.date===t.dstr&&!p.out)}
function getGPS(){return new Promise((res,rej)=>{
  if(!navigator.geolocation)return rej('none');
  navigator.geolocation.getCurrentPosition(p=>res(p.coords),e=>rej(e),
    {enableHighAccuracy:true,timeout:12000,maximumAge:0})})}
async function doPunch(dir){
  const e=emp(S.meId);if(!e)return;
  const t=todayCtx();
  if(dir==='in'){
    const shifts=todayShifts(e.id);
    if(!shifts.length){toast(`You're not on today's schedule, so clock-in is locked 🔒`);return}
    if(openPunch(e.id)){toast(`You're already clocked in`);return}
    const [h,m]=shifts[0].start.split(':').map(Number);
    const st=new Date();st.setHours(h,m,0,0);
    if(t.now.getTime()<st.getTime()-20*60000){
      toast(`Too early — clock-in opens 20 min before your ${t12(shifts[0].start)} shift`);return}
  }else if(!openPunch(e.id)){toast(`You're not clocked in`);return}
  toast('📍 Checking you’re at the store…');
  let c;
  try{c=await getGPS()}
  catch{toast('Couldn’t read GPS — allow Location access for this page and try again');return}
  /* server-verified punch when the cloud is set up (admin sees it instantly) */
  if(sess&&sess.type==='emp'&&sess.pin){
    try{
      const r=await apiFetch('/sched-punch',{method:'POST',
        body:JSON.stringify({pin:sess.pin,dir,lat:c.latitude,lng:c.longitude})});
      if(r.ok){
        toast(dir==='in'?`✅ Clocked in (${r.dist} m from the store)`:'👋 Clocked out — nice shift!');
        const st=await pullState(false);if(st)applyServerState(st);
        render();return;
      }
      if(r.status!==503&&r.error){toast('❌ '+r.error);return}
      /* 503 = cloud storage not provisioned yet → fall back to on-device punch */
    }catch{}
  }
  const d=Math.round(distM(c.latitude,c.longitude,S.location.lat,S.location.lng));
  if(d>S.location.radius){
    const dd=d>=1000?(d/1000).toFixed(1)+' km':d+' m';
    toast(`❌ You're ${dd} from ${S.location.name} — you can only clock ${dir} at the store`);return}
  if(dir==='in'){
    S.punches.push({id:'p'+(S.nextId++),empId:e.id,date:t.dstr,
      in:t.now.toISOString(),out:null,inDist:d,outDist:null});
    toast(`✅ Clocked in at ${fmtClock(t.now)} (${d} m from the store)`);
  }else{
    const p=openPunch(e.id);p.out=t.now.toISOString();p.outDist=d;
    const hrsW=((new Date(p.out)-new Date(p.in))/3600000).toFixed(2);
    toast(`👋 Clocked out at ${fmtClock(t.now)} — ${hrsW} hrs today`);
  }
  render();
}
function punchesInPeriod(offs){
  const dates=new Set();
  offs.forEach(off=>{for(let i=0;i<7;i++)dates.add(dayDateAt(off,i).toLocaleDateString('en-CA'))});
  return S.punches.filter(p=>dates.has(p.date));
}
function clockedHours(eid,offs){
  return punchesInPeriod(offs).filter(p=>p.empId===eid&&p.out)
    .reduce((t,p)=>t+(new Date(p.out)-new Date(p.in))/3600000,0);
}
function delPunch(id){S.punches=S.punches.filter(p=>p.id!==id);render();toast('Punch removed')}
/* Punctuality: compare punches to that day's agreed shift — behavior data, never pay */
function schedWindow(empId,dateStr){
  const d=new Date(dateStr+'T12:00:00');
  const wk=S.weeks[wkKey(monday(d))];if(!wk)return null;
  const day=(d.getDay()+6)%7;
  const mine=wk.shifts.filter(s=>s.empId===empId&&s.day===day);
  if(!mine.length)return null;
  const start=mine.reduce((a,s)=>s.start<a?s.start:a,mine[0].start);
  const end=mine.reduce((a,s)=>s.end>a?s.end:a,mine[0].end);
  const mk=t=>{const[x,y]=t.split(':').map(Number);
    const dd=new Date(dateStr+'T12:00:00');dd.setHours(x,y,0,0);return dd};
  return {start:mk(start),end:mk(end)};
}
const GRACE_MIN=5;
function punchFlags(p){
  const w=schedWindow(p.empId,p.date);
  if(!w)return {late:0,early:0,unsched:true};
  const late=Math.round((new Date(p.in)-w.start)/60000);
  const early=p.out?Math.round((w.end-new Date(p.out))/60000):0;
  return {late:late>GRACE_MIN?late:0, early:early>GRACE_MIN?early:0};
}

/* ---------- payroll view ---------- */
function payOffsets(){return S.paySpan===2?[0,1]:[0]}
function rPay(){
  const offs=payOffsets();
  const rows=S.employees.map(e=>{
    let h=0;offs.forEach(off=>weekAt(off).shifts.forEach(s=>{if(s.empId===e.id)h+=hrs(s)}));
    const clk=clockedHours(e.id,offs);
    const payH=h;    // ALWAYS pay the agreed scheduled hours — punches are behavior data only
    const gross=payH*e.wage;
    return {e,h,clk,payH,gross};
  }).filter(r=>r.h>0||r.clk>0).sort((a,b)=>b.gross-a.gross);
  const totH=rows.reduce((t,r)=>t+r.payH,0);
  const totPay=rows.reduce((t,r)=>t+r.gross,0);
  const sales=offs.reduce((t,off)=>t+(Number(S.sales[weekKeyAt(off)])||0),0);
  const pct=sales>0?totPay/sales*100:null;
  const pctColor=pct==null?'':pct<=32?'var(--green)':pct<=40?'var(--amber)':'var(--red)';
  const table=rows.map(r=>`<div class="hourrow">
      <span class="nm">${r.e.name}</span>
      <span style="flex:1;font-size:12.5px;color:var(--ink2);font-weight:600">
        ${r.h.toFixed(1)}h agreed × $${r.e.wage}</span>
      <b>$${r.gross.toFixed(2)}</b></div>`).join('');
  /* attendance / reliability summary — informational only */
  const rel=S.employees.map(e=>{
    const ps=punchesInPeriod(offs).filter(p=>p.empId===e.id);
    if(!ps.length)return '';
    let nLate=0,lateMin=0,nEarly=0;
    ps.forEach(p=>{const f=punchFlags(p);
      if(f.late){nLate++;lateMin+=f.late}
      if(f.early)nEarly++;});
    const ok=ps.length-nLate;
    const flag=nLate||nEarly;
    return `<div class="hourrow"><span class="nm">${e.name}</span>
      <span style="flex:1;font-size:12.5px;color:var(--ink2);font-weight:600">
        ${ps.length} punch${ps.length>1?'es':''} · ${ok} on time${nLate?` · ${nLate} late (avg ${Math.round(lateMin/nLate)}m)`:''}${nEarly?` · ${nEarly} left early`:''}</span>
      <b>${flag?'⚠️':'✅'}</b></div>`;
  }).join('');
  const plist=punchesInPeriod(offs).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0).map(p=>{
    const e=emp(p.empId);if(!e)return '';
    const f=punchFlags(p);
    const badge=f.unsched?'❔':(f.late||f.early)
      ?[f.late?`⏰ ${f.late}m late`:'',f.early?`🏃 left ${f.early}m early`:''].filter(Boolean).join(' · ')
      :'✅ on time';
    return `<div class="hourrow"><span class="nm">${e.name}</span>
      <span style="flex:1;font-size:12px;color:var(--ink2);font-weight:600">
        ${p.date.slice(5)} · ${fmtClock(p.in)}–${p.out?fmtClock(p.out):'…'} · 📍${p.inDist}m</span>
      <b style="font-size:11px;${(f.late||f.early)?'color:var(--red)':''}">${badge}</b>
      <button class="del" onclick="delPunch('${p.id}')">✕</button></div>`;
  }).join('');
  const salesInputs=offs.map(off=>`
    <label>Est. sales — week of ${fmtD(dayDateAt(off,0))} ($)</label>
    <input inputmode="numeric" value="${S.sales[weekKeyAt(off)]||''}" placeholder="e.g. 9500"
      onchange="S.sales['${weekKeyAt(off)}']=this.value;render()">`).join('');
  const range=offs.length===2?fmtD(dayDateAt(0,0))+' – '+fmtD(dayDateAt(1,6)):fmtRange();
  return `${weekBar()}
    <div class="optrow" style="margin:2px 0 12px">
      <button class="${S.paySpan===1?'sel':''}" onclick="S.paySpan=1;render()">This week</button>
      <button class="${S.paySpan===2?'sel':''}" onclick="S.paySpan=2;render()">2-week pay period</button>
    </div>
    <div class="stats">
      <div class="stat"><b>${totH.toFixed(1)}</b><span>Hours</span></div>
      <div class="stat"><b>$${Math.round(totPay)}</b><span>Gross payroll</span></div>
      <div class="stat"><b style="color:${pctColor}">${pct!=null?pct.toFixed(1)+'%':'—'}</b><span>Labor %</span></div>
    </div>
    <h2 class="section">Pay by person · ${range}</h2>
    <div class="card">${table||'<div class="empty">Nobody scheduled in this period</div>'}</div>
    <div class="card">${salesInputs}
      <p style="font-size:12.5px;color:var(--ink2);margin-top:10px">Labor % = payroll ÷ sales.
      Coffee shops & bakeries usually aim for <b>25–35%</b>. Green ≤32%, amber ≤40%.</p></div>
    <h2 class="section">🕰 Reliability (info only — never affects pay)</h2>
    <div class="card">${rel||'<div class="empty">No punches yet this period</div>'}</div>
    <h2 class="section">⏱ Time clock punches</h2>
    <div class="card">${plist||'<div class="empty">No GPS punches yet this period</div>'}</div>
    <div class="rowbtns">
      <button class="btn primary" onclick="exportPayrollCSV()">⬇️ Export payroll CSV</button>
    </div>
    <div class="note"><b>How pay is counted</b>Pay is always the <i>agreed scheduled hours</i> × wage.
    GPS punches never change a paycheck — they're your attendance record (late arrivals and early
    exits get flagged after a ${GRACE_MIN}-minute grace). Tap ✕ to remove a bad punch.</div>`;
}
function exportPayrollCSV(){
  const offs=payOffsets();
  const range=offs.length===2?fmtD(dayDateAt(0,0))+'-'+fmtD(dayDateAt(1,6)):fmtRange();
  let csv='Employee,Role,Phone,Hourly Rate,Agreed Hours,Gross Pay,Clocked Hours (info),Late Punches (info),Period\n';
  S.employees.forEach(e=>{
    let h=0;offs.forEach(off=>weekAt(off).shifts.forEach(s=>{if(s.empId===e.id)h+=hrs(s)}));
    if(!h)return;
    const clk=clockedHours(e.id,offs);
    const nLate=punchesInPeriod(offs).filter(p=>p.empId===e.id&&punchFlags(p).late).length;
    csv+=`"${e.name}","${e.role}","${e.phone}",${e.wage},${h.toFixed(2)},${(h*e.wage).toFixed(2)},${clk.toFixed(2)},${nLate},"${range}"\n`;
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='colette-payroll.csv';a.click();
  toast('Payroll CSV downloaded — hand it to payroll 💵');
}

function pickRole(i){_role=i?'Shift Lead':'Barista';
  document.getElementById('r0').classList.toggle('sel',i===0);
  document.getElementById('r1').classList.toggle('sel',i===1)}
function saveEmp(id){
  const name=document.getElementById('en').value.trim();
  if(!name){toast('Name is required');return}
  const avail=DAYS.map((_,i)=>{
    const t=document.getElementById('at'+i).value;
    return t==='custom'
      ?{type:'custom',from:document.getElementById('af'+i).value,to:document.getElementById('ao'+i).value}
      :{type:t};
  });
  const pin=(document.getElementById('epin').value||'').trim();
  if(pin&&!/^\d{4}$/.test(pin)){toast('PIN must be exactly 4 digits');return}
  if(pin&&S.employees.some(e=>e.pin===pin&&e.id!==id)){toast('That PIN is taken — pick another');return}
  const data={name,phone:document.getElementById('ep').value.trim(),pin,
    wage:parseFloat(document.getElementById('ew').value)||16,
    role:document.getElementById('r1').classList.contains('sel')?'Shift Lead':'Barista',avail};
  if(id)Object.assign(emp(id),data);
  else S.employees.push({...data,id:'e'+(S.nextId++)+'n',
    color:COLORS[S.employees.length%COLORS.length]});
  closeSheet();render();toast('Saved ✓');
}
function delEmp(id){
  Object.values(S.weeks).forEach(w=>w.shifts.forEach(s=>{if(s.empId===id){s.empId=null;s.confirmed=false}}));
  S.employees=S.employees.filter(e=>e.id!==id);
  if(S.meId===id)S.meId=null;
  closeSheet();render();toast('Removed');
}

      const fails=r.results.filter(x=>!x.sent&&x.reason!=='No shifts in period');
      toast(`🚀 Sent ${sent}/${r.results.length} — replies auto-confirm`);
      if(fails.length)setTimeout(()=>toast('⚠️ '+fails[0].name+': '+fails[0].reason),2800);
    }else toast(r.error||r.fix||'Send failed');
  }catch{toast('Could not reach the cloud')}
}
async function refreshConf(){
  const st=await pullState(true);
  if(st){applyServerState(st);render();toast('🔄 Updated from the cloud')}
  else toast('Nothing in the cloud yet — Publish first to sync');
}
function copyLastWeek(){
  const prev=new Date(S.weekStart);prev.setDate(prev.getDate()-7);
  const pw=S.weeks[wkKey(prev)];
  if(!pw||!pw.shifts.length){toast('Nothing on last week to copy');return}
  const w=week();
  pw.shifts.forEach(s=>w.shifts.push({...s,id:'s'+(S.nextId++),confirmed:false}));
  w.published=false;toast('Copied '+pw.shifts.length+' shifts from last week');render();
}

/* ics download */
function downloadICS(eid){
  const e=emp(eid);const w=week();
  const mine=w.shifts.filter(s=>s.empId===eid);
  if(!mine.length){toast('No shifts to add');return}
  const dt=(d,t)=>{const x=new Date(d);const[h,m]=t.split(':');
    return x.getFullYear()+String(x.getMonth()+1).padStart(2,'0')+String(x.getDate()).padStart(2,'0')+
      'T'+h+m+'00'};
  const ev=mine.map(s=>['BEGIN:VEVENT',
    'UID:'+s.id+'@brewcrew','DTSTART:'+dt(dayDate(s.day),s.start),'DTEND:'+dt(dayDate(s.day),s.end),
    'SUMMARY:🥐 '+S.shopName+' — '+(s.tpl||'Shift'),'END:VEVENT'].join('\r\n')).join('\r\n');
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//BrewCrew//EN',ev,'END:VCALENDAR'].join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));
  a.download=e.name.toLowerCase()+'-shifts.ics';a.click();
  toast('Calendar file downloaded 📆');
}

/* save / load */
function exportData(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));
  a.download='colette-schedule.json';a.click();
  toast('Saved! Load it next time via Team tab — same file feeds the dashboard');
}
function importData(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(!d.employees||!d.weeks)throw 0;
    S=normalizeState(d);
    render();toast('Data loaded ✓');
  }catch{toast('That file does not look like scheduler data')}};
  r.readAsText(f);inp.value='';
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;
  t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600)}

function normalizeState(d){
  d.weekStart=monday(new Date());     // always open on the current week
  d.sales=d.sales||{};d.textSpan=d.textSpan||1;d.paySpan=d.paySpan||1;
  d.punches=d.punches||[];
  d.location=d.location||{name:d.shopName,address:'',lat:34.070187,lng:-84.292770,radius:150};
  d.auth=d.auth||{adminId:'edgar',
    adminHash:'c876a763127581e553256770526722eaddfc01b5d86996c47fda8b033005ba62'};
  d.employees.forEach(e=>{if(e.pin===undefined)e.pin=''});
  d.nextId=d.nextId||1000;
  d.selDay=jsDay();d.view=d.view||'sched';d.meId=null;
  return d;
}

/* ---- boot: device-saved data → published data.json → built-in sample ---- */
(function boot(){
  let usedLocal=false;
  const raw=lsGet(LS_STATE);
  if(raw){try{const d=JSON.parse(raw);
    if(d.employees&&d.weeks){S=normalizeState(d);usedLocal=true}}catch{}}
  const sraw=lsGet(LS_SESS);
  if(sraw){try{const s0=JSON.parse(sraw);
    if(s0.type==='admin'||(s0.type==='emp'&&emp(s0.empId)))sess=s0;
    if(sess&&sess.type==='emp'){S.meId=sess.empId;S.view='my'}}catch{}}
  render();
  (async()=>{
    const isAdmSess=sess&&sess.type==='admin';
    /* cloud state: employees always take it; the admin's device keeps local
       edits and pulls on demand with 🔄 (publishing pushes local → cloud) */
    const st=await pullState(isAdmSess);
    if(st){
      if(isAdmSess)return;
      applyServerState(st);
      if(sess&&sess.type==='emp'&&!emp(sess.empId)){logout();return}
      render();toast('☁️ Live Colette schedule loaded');
      return;
    }
    if(usedLocal)return;
    /* fallback: static data.json (pre-cloud publishing) */
    fetch('data.json',{cache:'no-store'})
      .then(r=>r.ok?r.json():null)
      .then(d=>{
        if(!d||!d.employees||!d.weeks)return;
        S=normalizeState(d);
        if(sess&&sess.type==='emp'){
          if(!emp(sess.empId)){logout();return}
          S.meId=sess.empId;S.view='my';
        }
        render();toast('☁️ Live Colette schedule loaded');
      }).catch(()=>{});
  })();
})();
</script>
