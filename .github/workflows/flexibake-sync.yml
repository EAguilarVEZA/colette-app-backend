name: FlexiBake → Clover inventory sync

on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC = ~6am ET; morning zero + load today's delivery (fresh start)
    - cron: '0 11 * * *'   # 11:00 UTC = ~7am ET; warm the dashboard caches
    - cron: '0 21 * * *'   # 21:00 UTC = ~5pm ET; re-sync in case a delivery line was added during the day
  workflow_dispatch:         # manual "Run workflow" from the Actions tab
    inputs:
      task:
        description: 'sync | reset | setcosts | place'
        required: false
        default: 'sync'
      date:
        description: 'Delivery date (M/D/YYYY or YYYY-MM-DD). Blank = today (sync) / today+2 (place).'
        required: false
        default: ''
      place_mode:
        description: 'For task=place: dryrun | review (default, holds before submit) | submit'
        required: false
        default: 'review'
      order:
        description: 'For task=place: optional JSON [{"code":"7171","qty":11}]. Blank = smart recommendation.'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps + Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run sync
        env:
          FLEXIBAKE_USER: ${{ secrets.FLEXIBAKE_USER }}
          FLEXIBAKE_PASS: ${{ secrets.FLEXIBAKE_PASS }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          TASK: ${{ github.event.inputs.task || (github.event.schedule == '0 11 * * *' && 'warm' || 'sync') }}
          SYNC_DATE: ${{ github.event.inputs.date || '' }}
          PLACE_DATE: ${{ github.event.inputs.date || '' }}
          PLACE_MODE: ${{ github.event.inputs.place_mode || 'review' }}
          ORDER: ${{ github.event.inputs.order || '' }}
        run: npm run sync
      - name: Upload order screenshots (placement runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-screenshots
          path: scraper/order-*.png
          if-no-files-found: ignore
